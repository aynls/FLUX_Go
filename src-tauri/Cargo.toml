[package]
name = "lutriui"
version = "0.1.0"
description = "多模型图像生成与编辑工作台"
edition = "2021"

[lib]
name = "lutriui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tokio = { version = "1", features = ["time", "net", "sync"] }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service"] }
arboard = "3.6"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rmcp = { version = "3.5.1", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "tower",
] }
axum = "0.8"
tower-http = { version = "0.6", features = ["limit"] }
tokio-util = { version = "0.7", features = ["rt"] }
subtle = "2.6"
jsonschema = { version = "0.58.6", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
strip = true
lto = "thin"
